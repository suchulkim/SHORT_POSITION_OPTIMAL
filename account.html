<!DOCTYPE html>
        <html lang="ko">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>바이낸스 계좌 잔고 현황</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                body {
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    padding: 20px;
                }

                .container {
                    max-width: 1400px;
                    margin: 0 auto;
                }

                .header {
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    margin-bottom: 20px;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                }

                .header h1 {
                    color: #333;
                    margin-bottom: 10px;
                    font-size: 28px;
                }

                .header .subtitle {
                    color: #666;
                    font-size: 14px;
                }

                .stats-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 20px;
                    margin-bottom: 20px;
                }

                .stat-card {
                    background: white;
                    border-radius: 15px;
                    padding: 25px;
                    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                    transition: transform 0.3s ease;
                }

                .stat-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
                }

                .stat-card .label {
                    font-size: 14px;
                    color: #666;
                    margin-bottom: 10px;
                    font-weight: 500;
                }

                .stat-card .value {
                    font-size: 32px;
                    font-weight: bold;
                    color: #333;
                }

                .stat-card .change {
                    font-size: 16px;
                    margin-top: 8px;
                }

                .change.positive {
                    color: #10b981;
                }

                .change.negative {
                    color: #ef4444;
                }

                .chart-container {
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                    margin-bottom: 20px;
                }

                .chart-container h2 {
                    color: #333;
                    margin-bottom: 20px;
                    font-size: 20px;
                }

                .chart-wrapper {
                    position: relative;
                    height: 400px;
                }

                .controls {
                    display: flex;
                    gap: 10px;
                    margin-bottom: 20px;
                    flex-wrap: wrap;
                }

                .btn {
                    padding: 10px 20px;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                }

                .btn-secondary {
                    background: #e5e7eb;
                    color: #333;
                }

                .btn-secondary:hover {
                    background: #d1d5db;
                }

                .btn.active {
                    background: #667eea;
                    color: white;
                }

                .error {
                    background: #fee2e2;
                    color: #dc2626;
                    padding: 20px;
                    border-radius: 8px;
                    margin-bottom: 20px;
                    white-space: pre-line;
                }

                .last-update {
                    text-align: center;
                    color: white;
                    font-size: 14px;
                    margin-top: 20px;
                    padding: 15px;
                    background: rgba(255, 255, 255, 0.1);
                    border-radius: 10px;
                }

                .table-container {
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                    overflow-x: auto;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                th, td {
                    padding: 12px;
                    text-align: left;
                    border-bottom: 1px solid #e5e7eb;
                }

                th {
                    background: #f9fafb;
                    font-weight: 600;
                    color: #333;
                }

                tr:hover {
                    background: #f9fafb;
                }

                @media (max-width: 768px) {
                    .stats-grid {
                        grid-template-columns: 1fr;
                    }
                    .chart-wrapper {
                        height: 300px;
                    }
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>💰 바이낸스 계좌 잔고 현황</h1>
                    <p class="subtitle">실시간 잔고 추적 및 수익률 분석 (데이터 직접 삽입 방식)</p>
                </div>

                <div id="errorMessage" class="error" style="display: none;"></div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">현재 잔고</div>
                        <div class="value" id="currentBalance">$0.00</div>
                        <div class="change" id="balanceChange">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">기준 잔고</div>
                        <div class="value" id="baseBalance">$0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">총 수익률</div>
                        <div class="value" id="totalProfit">0.00%</div>
                        <div class="change" id="profitAmount">$0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">최고 잔고</div>
                        <div class="value" id="maxBalance">$0.00</div>
                        <div class="change" id="maxDate">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">최저 잔고</div>
                        <div class="value" id="minBalance">$0.00</div>
                        <div class="change" id="minDate">--</div>
                    </div>
                </div>

                <div class="chart-container">
                    <h2>📈 잔고 추이 차트</h2>
                    <div class="controls">
                        <button class="btn btn-secondary period-btn active" data-period="24h">24시간</button>
                        <button class="btn btn-secondary period-btn" data-period="7d">7일</button>
                        <button class="btn btn-secondary period-btn" data-period="30d">30일</button>
                        <button class="btn btn-secondary period-btn" data-period="all">전체</button>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="balanceChart"></canvas>
                    </div>
                </div>

                <div class="table-container">
                    <h2>📊 최근 기록</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>시간</th>
                                <th>잔고</th>
                                <th>기준 잔고</th>
                                <th>수익률</th>
                                <th>변화량</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>

                <div class="last-update" id="lastUpdate">
                    🔄 Python 스크립트 실행 시 자동 업데이트됩니다
                </div>
            </div>

                let chartInstance = null;
                let allData = BALANCE_DATA;
                let currentPeriod = '24h';

                function initChart(labels, data, baseBalance) {
                    const ctx = document.getElementById('balanceChart').getContext('2d');
                    if (chartInstance) chartInstance.destroy();

                    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
                    gradient.addColorStop(1, 'rgba(102, 126, 234, 0.05)');

                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '현재 잔고',
                                data: data,
                                borderColor: '#667eea',
                                backgroundColor: gradient,
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 2
                            }, {
                                label: '기준 잔고',
                                data: Array(labels.length).fill(baseBalance),
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                fill: false,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true, position: 'top' },
                                tooltip: {
                                    mode: 'index',
                                    callbacks: {
                                        label: ctx => ctx.dataset.label + ': $' + ctx.parsed.y.toFixed(2)
                                    }
                                }
                            },
                            scales: {
                                y: { ticks: { callback: v => '$' + v.toFixed(2) } }
                            }
                        }
                    });
                }

                function filterDataByPeriod(data, period) {
                    if (!data || data.length === 0) return [];
                    const now = new Date();
                    let cutoffTime;
                    switch(period) {
                        case '24h': cutoffTime = new Date(now.getTime() - 24 * 60 * 60 * 1000); break;
                        case '7d': cutoffTime = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000); break;
                        case '30d': cutoffTime = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000); break;
                        case 'all':
                        default: return data;
                    }
                    return data.filter(item => new Date(item.timestamp) >= cutoffTime);
                }

                function updateDisplay() {
                    if (!allData || allData.length === 0) {
                        document.getElementById('errorMessage').textContent = 
                            'Python 스크립트를 실행하여 데이터를 생성하세요:\npython binance_account_manager.py';
                        document.getElementById('errorMessage').style.display = 'block';
                        return;
                    }

                    const filteredData = filterDataByPeriod(allData, currentPeriod);
                    const latest = allData[allData.length - 1];
                    const profit = latest.balance - latest.base_balance;

                    document.getElementById('currentBalance').textContent = '$' + latest.balance.toFixed(2);
                    document.getElementById('baseBalance').textContent = '$' + latest.base_balance.toFixed(2);
                    document.getElementById('totalProfit').textContent = latest.profit_pct.toFixed(2) + '%';
                    
                    const profitEl = document.getElementById('profitAmount');
                    profitEl.textContent = (profit >= 0 ? '+' : '') + '$' + profit.toFixed(2);
                    profitEl.className = 'change ' + (profit >= 0 ? 'positive' : 'negative');

                    const balances = allData.map(i => i.balance);
                    const maxBalance = Math.max(...balances);
                    const minBalance = Math.min(...balances);
                    const maxData = allData.find(i => i.balance === maxBalance);
                    const minData = allData.find(i => i.balance === minBalance);

                    document.getElementById('maxBalance').textContent = '$' + maxBalance.toFixed(2);
                    document.getElementById('maxDate').textContent = new Date(maxData.timestamp).toLocaleString('ko-KR');
                    document.getElementById('minBalance').textContent = '$' + minBalance.toFixed(2);
                    document.getElementById('minDate').textContent = new Date(minData.timestamp).toLocaleString('ko-KR');

                    const labels = filteredData.map(i => new Date(i.timestamp).toLocaleString('ko-KR', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    }));
                    initChart(labels, filteredData.map(i => i.balance), latest.base_balance);

                    const tbody = document.getElementById('historyBody');
                    tbody.innerHTML = '';
                    filteredData.slice(-20).reverse().forEach((item, idx, arr) => {
                        const row = tbody.insertRow();
                        const profitClass = item.profit_pct >= 0 ? 'positive' : 'negative';
                        let changeText = '--';
                        if (idx < arr.length - 1) {
                            const change = item.balance - arr[idx + 1].balance;
                            changeText = `<span class="change ${change >= 0 ? 'positive' : 'negative'}">${change >= 0 ? '+' : ''}$${change.toFixed(2)}</span>`;
                        }
                        row.innerHTML = `
                            <td>${new Date(item.timestamp).toLocaleString('ko-KR')}</td>
                            <td>$${item.balance.toFixed(2)}</td>
                            <td>$${item.base_balance.toFixed(2)}</td>
                            <td><span class="change ${profitClass}">${item.profit_pct.toFixed(2)}%</span></td>
                            <td>${changeText}</td>
                        `;
                    });

                    document.getElementById('lastUpdate').textContent = 
                        '마지막 업데이트: ' + new Date(latest.timestamp).toLocaleString('ko-KR');
                }

                document.querySelectorAll('.period-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentPeriod = this.dataset.period;
                        updateDisplay();
                    });
                });

                updateDisplay();
            </script>
